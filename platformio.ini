; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = bullm_main

[env]
platform = espressif32
framework = arduino
lib_deps = 
	adafruit/Adafruit NeoPixel@^1.12.3
	bblanchon/ArduinoJson@^7.2.1
	esp32async/ESPAsyncWebServer@3.7.9
	madhephaestus/ESP32Servo@1.2.1
	adafruit/Adafruit SSD1306@^2.5.14
	ESPmDNS
monitor_speed = 115200
build_flags = -frtti -fexceptions -D RELEASE

[esp32s3_defaults]
build_flags = ${env.build_flags} -D BOARD_HAS_PSRAM -D CONFIG_ASYNC_TCP_STACK_SIZE=32768

[env:bullm_main]
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board = esp32-s3-devkitc-1
build_flags = ${esp32s3_defaults.build_flags}
			  -D BOARD_BULLM_MAIN


